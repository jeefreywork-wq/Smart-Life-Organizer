<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Life Organizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="oldcode.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
<div id="app">

    <div id="page-auth" class="page">
        <div class="auth-wrapper">
            <div class="auth-card">
                <div class="auth-header">
                    <div class="logo-mark">✦</div>
                    <h1>Smart Life Organizer</h1>
                    <p>Organize your life, one category at a time</p>
                </div>

                <div class="auth-tabs">
                    <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Sign In</button>
                    <button class="auth-tab" id="tab-signup" onclick="switchTab('signup')">Sign Up</button>
                </div>

                <div id="form-login" class="auth-form">
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input class="form-input" id="login-email" type="email" placeholder="you@example.com" autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <div class="password-wrapper">
                            <input class="form-input" id="login-password" type="password" placeholder="Your password" autocomplete="current-password">
                            <button class="toggle-pw" type="button" onclick="togglePassword('login-password', this)">👁</button>
                        </div>
                    </div>
                    <div id="login-error" class="auth-error hidden"></div>
                    <button class="btn-primary auth-btn" id="login-btn" onclick="handleLogin()">
                        <span class="btn-text">Sign In</span>
                        <span class="btn-loader hidden">⏳</span>
                    </button>
                    <div class="auth-divider">
                        <span>Don't have an account?</span>
                        <button class="auth-link" onclick="switchTab('signup')">Sign Up</button>
                    </div>
                </div>

                <div id="form-signup" class="auth-form hidden">
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input class="form-input" id="signup-email" type="email" placeholder="you@example.com" autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <div class="password-wrapper">
                            <input class="form-input" id="signup-password" type="password" placeholder="At least 6 characters" autocomplete="new-password">
                            <button class="toggle-pw" type="button" onclick="togglePassword('signup-password', this)">👁</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Confirm Password</label>
                        <div class="password-wrapper">
                            <input class="form-input" id="signup-confirm" type="password" placeholder="Repeat password" autocomplete="new-password">
                            <button class="toggle-pw" type="button" onclick="togglePassword('signup-confirm', this)">👁</button>
                        </div>
                    </div>
                    <div id="signup-error" class="auth-error hidden"></div>
                    <div id="signup-success" class="auth-success hidden"></div>
                    <button class="btn-primary auth-btn" id="signup-btn" onclick="handleSignup()">
                        <span class="btn-text">Create Account</span>
                        <span class="btn-loader hidden">⏳</span>
                    </button>
                    <div class="auth-divider">
                        <span>Already have an account?</span>
                        <button class="auth-link" onclick="switchTab('login')">Sign In</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="page-home" class="page hidden">
        <div class="home-wrapper">
            <header class="home-header">
                <div class="logo-mark">✦</div>
                <h1>Smart Life Organizer</h1>
                <p>Organize your life, one category at a time</p>
            </header>

            <div class="user-bar">
                <span class="user-email" id="user-email-display"></span>
                <button class="btn-signout" onclick="handleSignOut()">Sign Out</button>
            </div>

            <div id="category-grid" class="category-grid"></div>
            <div class="home-actions">
                <button class="btn-outline" onclick="showAddCategoryModal()">+ Add Category</button>
                <button class="btn-primary" id="open-btn" onclick="openSelectedCategory()" disabled>Open Category</button>
            </div>

            <div id="sync-indicator" class="sync-indicator hidden">
                <span>⏳ Syncing…</span>
            </div>
        </div>
    </div>

    <div id="page-category" class="page hidden">
        <div id="category-content"></div>
    </div>
</div>

<div id="modal-overlay" class="modal-overlay hidden" onclick="handleOverlayClick(event)">
    <div class="modal-box" id="modal-box">
        <button class="modal-close" onclick="closeModal()">✕</button>
        <div id="modal-content"></div>
    </div>
</div>

<script src="auth.js"></script>
<script src="oldcode.js"></script>
</body>
</html>
