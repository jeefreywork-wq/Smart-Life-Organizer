<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Life Organizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="sttylin.css">
</head>
<body>

<div id="page-auth" class="page">
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="logo-mark">✦</div>
                <h1>Smart Life Organizer</h1>
                <p>Organize your life, one category at a time</p>
            </div>

            <div class="auth-tabs">
                <button class="auth-tab active" id="tab-login" onclick="switchAuthTab('login')">Sign In</button>
                <button class="auth-tab" id="tab-signup" onclick="switchAuthTab('signup')">Sign Up</button>
            </div>

            <div id="form-login" class="auth-form">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input class="form-input" id="login-email" type="email" placeholder="your@email.com" autocomplete="email">
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input class="form-input" id="login-password" type="password" placeholder="••••••••" autocomplete="current-password">
                </div>
                <div id="login-error" class="auth-error hidden"></div>
                <button class="btn-primary auth-btn" id="login-btn" onclick="handleLogin()">Sign In</button>
                <div class="auth-divider"><span>or</span></div>
                <button class="btn-google" onclick="handleGoogleSignIn()">
                    <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.706A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 7.294C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
                    Continue with Google
                </button>
            </div>

            <div id="form-signup" class="auth-form hidden">
                <div class="form-group">
                    <label class="form-label">Display Name</label>
                    <input class="form-input" id="signup-name" type="text" placeholder="Your name" autocomplete="name">
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input class="form-input" id="signup-email" type="email" placeholder="your@email.com" autocomplete="email">
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input class="form-input" id="signup-password" type="password" placeholder="Min 6 characters" autocomplete="new-password">
                </div>
                <div id="signup-error" class="auth-error hidden"></div>
                <button class="btn-primary auth-btn" id="signup-btn" onclick="handleSignup()">Create Account</button>
                <div class="auth-divider"><span>or</span></div>
                <button class="btn-google" onclick="handleGoogleSignIn()">
                    <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.706A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 7.294C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
                    Continue with Google
                </button>
            </div>
        </div>
    </div>
</div>

<div id="app" class="hidden">

    <div id="page-home" class="page">
        <div class="home-wrapper">
            <header class="home-header">
                <div class="logo-mark">✦</div>
                <h1>Smart Life Organizer</h1>
                <p>Organize your life, one category at a time</p>
            </header>

            <div class="user-bar">
                <div class="user-info">
                    <div class="user-avatar" id="user-avatar">✦</div>
                    <span id="user-name">Loading…</span>
                </div>
                <button class="theme-toggle" id="theme-toggle-home" onclick="toggleTheme()" title="Toggle light/dark mode">🌙</button>
                <button class="btn-outline btn-small" onclick="handleSignOut()">Sign Out</button>
            </div>

            <div id="category-grid" class="category-grid"></div>
            <div class="home-actions">
                <button class="btn-outline" onclick="showAddCategoryModal()">+ Add Category</button>
                <button class="btn-primary" id="open-btn" onclick="openSelectedCategory()" disabled>Open Category</button>
            </div>
        </div>
    </div>

    <div id="page-category" class="page hidden">
        <div id="category-content"></div>
    </div>
</div>

<div id="loading-overlay" class="loading-overlay">
    <div class="loading-spinner">
        <div class="logo-mark" style="font-size:2.5rem">✦</div>
        <p>Loading…</p>
    </div>
</div>

<div id="modal-overlay" class="modal-overlay hidden" onclick="handleOverlayClick(event)">
    <div class="modal-box" id="modal-box">
        <button class="modal-close" onclick="closeModal()">✕</button>
        <div id="modal-content"></div>
    </div>
</div>

<script>
(function() {
    const saved = localStorage.getItem('slo-theme');
    const preferLight = window.matchMedia('(prefers-color-scheme: light)').matches;
    if (saved === 'light' || (!saved && preferLight)) {
        document.body.classList.add('light');
    }
})();

function toggleTheme() {
    const isLight = document.body.classList.toggle('light');
    document.body.classList.toggle('dark', !isLight);
    localStorage.setItem('slo-theme', isLight ? 'light' : 'dark');
    document.querySelectorAll('.theme-toggle').forEach(btn => {
        btn.textContent = isLight ? '☀️' : '🌙';
    });
}

document.addEventListener('DOMContentLoaded', function() {
    const icon = document.body.classList.contains('light') ? '☀️' : '🌙';
    document.querySelectorAll('.theme-toggle').forEach(btn => btn.textContent = icon);
});
</script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="Loogiic.js"></script>
</body>
</html>
