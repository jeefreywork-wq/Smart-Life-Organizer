<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Life Organizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="stylee.css">
</head>
<body>
    <div id="app">
        <div id="page-home" class="page">
            <div class="home-wrapper">
                <header class="home-header">
                    <div class="logo-mark">✦</div>
                    <h1>Smart Life Organizer</h1>
                    <p>Organize your life, one category at a time</p>
                </header>
                <div id="category-grid" class="category-grid"></div>
                <div class="home-actions">
                    <button class="btn-outline" onclick="showAddCategoryModal()">+ Add Category</button>
                    <button class="btn-primary" id="open-btn" onclick="openSelectedCategory()" disabled>Open Category</button>
                </div>
            </div>
        </div>

        <div id="page-category" class="page hidden">
            <div id="category-content"></div>
        </div>
    </div>

    <div id="modal-overlay" class="modal-overlay hidden" onclick="handleOverlayClick(event)">
        <div class="modal-box" id="modal-box">
            <button class="modal-close" onclick="closeModal()">&#10005;</button>
            <div id="modal-content"></div>
        </div>
    </div>

    <script src="logiic.js"></script>
</body>
</html>
